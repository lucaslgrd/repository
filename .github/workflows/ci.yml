name: INTEGRATION

on:
  push:
    branches: [ develop ]

jobs:
  Backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    services:
      mariadb:
        image: mariadb:12.1.2
        env:
          MARIADB_ROOT_PASSWORD: toor
          MARIADB_DATABASE: test
          MARIADB_USER: test
          MARIADB_PASSWORD: test
        ports:
          - 3306:3306

    env:
      BDD_HOST: 127.0.0.1
      BDD_NAME: test
      BDD_USER: test
      BDD_PASS: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Database Check
        run: |
          sudo apt update
          sudo apt install -y mysql-client
          mysql -h 127.0.0.1 --port 3306 -u root -ptoor -e "SHOW DATABASES"

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install

      - name: Init and Populate DB
        run: |
          npm run initbdd
          npm run populate

      - name: Run tests and coverage
        run: npm run test:cov

      - name: Upload Coverage report
        uses: actions/upload-artifact@v4
        with:
          name: back-coverage-report
          path: Backend/coverage
          retention-days: 1

  Frontend:
    needs: [ Backend ]
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Backend
        run: |
          cd ..
          docker compose -f docker-compose-back-build.yml up -d
          docker ps -a

      - name: Wait for Backend to be ready
        uses: jakejarvis/wait-action@master
        with:
          time: '10s'

      - name: Check Backend
        if: success()
        run: curl http://127.0.0.1:12000

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Cypress E2E Install
        uses: cypress-io/github-action@v6
        with:
          runTests: false
          working-directory: Frontend

      - name: Install dependencies
        run: npm install

      - name: Cypress E2E Run
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: npm run dev
          working-directory: Frontend

      - name: Generate Coverage report
        run: npm run cypress:cov

      - name: Upload Cypress Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: Frontend/cypress/screenshots
          retention-days: 1

      - name: Upload Cypress Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: Frontend/cypress/videos
          retention-days: 1

      - name: Upload Coverage report
        uses: actions/upload-artifact@v4
        with:
          name: cypress-coverage-report
          path: Frontend/coverage
          retention-days: 1

      - name: Clean Docker
        if: always()
        run: |
          cd ..
          docker compose -f docker-compose-back-build.yml down