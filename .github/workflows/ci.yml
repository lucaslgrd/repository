name: INTEGRATION

on:
  push:
    branches: [ develop ]

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: toor
          MARIADB_DATABASE: test
          MARIADB_USER: test
          MARIADB_PASSWORD: test
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ptoor"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      BDD_HOST: localhost
      BDD_NAME: test
      BDD_USER: test
      BDD_PASS: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for database
        run: |
          for i in {1..30}; do
            mysql -h localhost -u root -ptoor -e "SELECT 1" && break
            echo "Waiting for MariaDB..."
            sleep 2
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Init and populate database
        run: |
          npm run initbdd
          npm run populate

      - name: Run tests and coverage
        run: npm run test:cov

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: Backend/coverage
          retention-days: 1

  frontend:
    needs: backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start backend (Docker)
        run: |
          docker compose -f ../docker-compose-back-build.yml up -d
          docker ps

      - name: Wait for backend API
        run: |
          until curl -s http://localhost:12000 > /dev/null; do
            echo "Waiting for backend..."
            sleep 3
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Cypress install
        uses: cypress-io/github-action@v6
        with:
          runTests: false
          working-directory: Frontend

      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: npm run dev
          working-directory: Frontend

      - name: Generate Cypress coverage
        run: npm run cypress:cov

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: Frontend/cypress/screenshots
          retention-days: 1

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: Frontend/cypress/videos
          retention-days: 1

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: Frontend/coverage
          retention-days: 1

      - name: Stop backend containers
        if: always()
        run: docker compose -f ../docker-compose-back-build.yml down